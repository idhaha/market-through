<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketThrough VI 모니터링</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261108_tabular_nums"><link rel="stylesheet" href="data-collection-info.css?v=20261107_vi_guide"><link rel="stylesheet" href="vi-monitor.css?v=20261111_base">
<script src="vi-monitor.js?v=20261111_base" defer></script>
<script src="data-collection-info.js?v=20261111_base" defer></script><script src="vi-monitor-info.js?v=20261111_base" defer></script></head>
<body class="vi-monitor"><main class="panel vi-panel">
<header class="panel-header"><h1>VI 실시간 모니터링</h1><span id="viClock" class="vi-clock"></span>
<div class="vi-controls">
<label>거래대금(전일기준) <select id="viPrevAmount" class="vi-filter-select" aria-label="전일 거래대금 필터"><option value="0">전체</option><option value="2e10">200억 이상</option><option value="5e10">500억 이상</option><option value="1e11">1천억 이상</option><option value="3e11">3천억 이상</option><option value="5e11">5천억 이상</option><option value="1e12">1조 이상</option><option value="2e12">2조 이상</option></select></label>
<label>시가총액 <select id="viMarketCap" class="vi-filter-select" aria-label="시가총액 필터"><option value="0">전체</option><option value="2e11">2천억 이상</option><option value="5e11">5천억 이상</option><option value="1e12">1조 이상</option><option value="2e12">2조 이상</option><option value="5e12">5조 이상</option><option value="1e13">10조 이상</option></select></label>
<span id="viFilterNote" class="vi-filter-note"></span>
<label title="발동부터 해제 전까지 Base 대비 다른 시장(KRX · NXT · 선물 최근월 · 차기월) 괴리율의 절댓값이 한 번이라도 1% 이상이었던 행만 봅니다"><input id="viGapOnly" type="checkbox" checked> 괴리율 1% 이상 보기</label><label><input id="viTopmost" type="checkbox"> 항상 위</label></div></header>
<div class="table-wrapper"><table aria-label="당일 VI 발동·해제와 선물 가격제한 이벤트">
<thead><tr>
<th scope="col">순위</th><th scope="col"><button data-sort="market">시장</button></th><th scope="col"><button data-sort="name">종목명</button></th>
<th scope="col"><button data-sort="rate">등락률</button></th>
<th scope="col"><button data-sort="marketCap">시가총액</button></th>
<th scope="col"><button data-sort="amount">거래대금(백만)</button></th>
<th scope="col"><button data-sort="exchange">발동 거래소</button></th><th scope="col"><button data-sort="kind">구분</button></th>
<th scope="col" aria-sort="descending"><button data-sort="startedAt">발동 시각</button></th>
<th scope="col"><button data-sort="releasedAt">해제 시각</button></th><th scope="col"><button data-sort="remaining">해제까지(예상)</button></th>
<th scope="col"><button data-sort="gapKRX">KRX 괴리율</button></th>
<th scope="col"><button data-sort="gapNXT">NXT 괴리율</button></th>
<th scope="col"><button data-sort="gapFUT">선물 괴리율</button>
<select id="viFutureMonth" class="interval-select" aria-label="선물 월물 선택"><option value="recent">최근월</option><option value="next">차기월</option></select></th>
<th scope="col"><button data-sort="bidAverage" title="KRX 매수 1~10호가 각각의 가격 × 잔량을 평균한 금액 (KRX 발동 행만)"><span class="th-lines">KRX 매수<br>10호가평균</span></button></th>
</tr></thead>
<tbody id="viBody"><tr><td colspan="15" class="vi-empty">VI 수신 연결 중…</td></tr></tbody></table></div>
<footer><div id="viSummary" class="vi-summary" aria-live="polite"></div>
<p id="viStatus" class="vi-status" role="status">서버 연결 중</p>
<p class="vi-status">발동 거래소가 Base입니다. 괴리율 = (그 시장 현재가 ÷ Base 현재가 − 1) × 100. 등락률 · 시가총액 · 거래대금 · 호가 평균은 발동 거래소 기준이고, 해제되면 해제 때 값으로 남습니다. 선물 행은 LS 가격제한 이벤트(JD0 · JX0)이며 5분 뒤 해제로 봅니다. 괴리율이 1% 이상이었던 행은 발동부터 4분간 1초마다 Base 등락률과 각 시장 괴리율을 서버에 기록합니다.</p></footer>
</main></body></html>
